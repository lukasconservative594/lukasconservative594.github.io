<header role="banner" id="header">
<div class="container">
  <div class="site-title">
    <h1><a href="{{ '/' | relative_url }}" title="Home" rel="home">{{ site.title }}</a></h1>
  </div>

  <!-- CSS-only mobile menu toggle (checkbox hack); navigation.js only adds niceties. -->
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-expanded="false" autocomplete="off" />
  <label for="menu-toggle" class="menu-button" aria-label="Open navigation menu">&#9776;</label>

  <div class="navigation">
    <label for="menu-toggle" class="menu-button" aria-label="Close navigation menu">&times;</label>
    <nav aria-label="Site">
      <ul role="list" class="main-menu">
      {% assign current_path = page.url | default: page.permalink %}
      {% for item in site.data.navigation.main %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if current_path == item.url or current_path == item.url | append: 'index.html' %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
      </ul>
      <ul role="list" class="utility-menu">
      {% for item in site.data.navigation.utility %}
        <li>
          <a href="{% if item.url contains '://' or item.url contains 'mailto:' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
      </ul>
    </nav>
  </div>
</div>
</header>
