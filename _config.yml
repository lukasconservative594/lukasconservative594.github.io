# ============================================================
# Site settings — edit these first.
# ============================================================
title: "Abdullah Azzam"
description: "Abdullah Azzam is a student of ... at UIN Syarif Hidayatullah Jakarta. His work focuses on ..."

# Configured for a GitHub Pages USER SITE at https://abdullah-azzam.github.io
#
# A user site needs the repository to be named exactly <username>.github.io, so
# BOTH of these have to be true, not just the second:
#   1. the GitHub account is renamed  DurovWannaBe -> abdullah-azzam
#   2. this repository is renamed     Website-     -> abdullah-azzam.github.io
#
# Renaming only the repository leaves the account as DurovWannaBe, which makes
# this an ordinary project site at
#   https://durovwannabe.github.io/abdullah-azzam.github.io/
# and the empty baseurl below would serve it with no CSS. In that case use:
#   url: "https://durovwannabe.github.io"
#   baseurl: "/abdullah-azzam.github.io"
url: "https://abdullah-azzam.github.io"
baseurl: ""

# Shown in the sidebar and footer.
author:
  name: "Abdullah Azzam"
  role: "Undergraduate Student"
  department: "Faculty of Social and Political Sciences"
  department_url: "https://fisip.uinjkt.ac.id/"
  institution: "UIN Syarif Hidayatullah Jakarta"
  institution_url: "https://www.uinjkt.ac.id/"
  address: "Jl. Ir. H. Juanda No. 95, Ciputat, Tangerang Selatan 15412, Indonesia"
  email: "abdullah.azzam21@mhs.uinjkt.ac.id"

markdown: kramdown
permalink: ":basename:output_ext"
theme: null

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .github/
  - .gitignore
  - .gitattributes
  - .DS_Store

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
