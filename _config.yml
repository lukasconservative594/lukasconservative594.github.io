# ============================================================
# Site settings — edit these first.
# ============================================================
title: "Abdullah Azzam"
description: "Abdullah Azzam is a student of ... at UIN Syarif Hidayatullah Jakarta. His work focuses on ..."

# Configured for a GitHub Pages USER SITE at https://durovwannabe.github.io
#
# A user site is served only when the repository is named exactly
# <username>.github.io. So this config needs one rename:
#   Website-  ->  durovwannabe.github.io
# (Settings -> General -> Repository name)
#
# The empty baseurl is only correct for a user site. If you keep the repository
# named Website-, it stays a project site and you need:
#   url: "https://durovwannabe.github.io"
#   baseurl: "/Website-"
#
# To publish under your own name instead, a custom domain is the way — it works
# with any username and any repository name. See the README.
url: "https://durovwannabe.github.io"
baseurl: ""

# Shown in the sidebar and footer.
author:
  name: "Abdullah Azzam"
  role: "Undergraduate Student"
  department: "Faculty of Social and Political Sciences"
  department_url: "https://fisip.uinjkt.ac.id/"
  institution: "UIN Syarif Hidayatullah Jakarta"
  institution_url: "https://www.uinjkt.ac.id/"
  address: "Jl. Ir. H. Juanda No. 95, Ciputat, Tangerang Selatan 15412, Indonesia"
  email: "abdullah.azzam21@mhs.uinjkt.ac.id"

markdown: kramdown
permalink: ":basename:output_ext"
theme: null

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .github/
  - .gitignore
  - .gitattributes
  - .DS_Store

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
